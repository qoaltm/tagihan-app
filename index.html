<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0C0C12" />
  <title>Tagihan Bulanan</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Sora:wght@400;600;800&display=swap" rel="stylesheet" />

  <!-- Tailwind config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sora: ['Sora','sans-serif'], mono: ['DM Mono','monospace'] },
          colors: {
            brand:     '#FF6B35',
            kredivo:   '#FF6B35',
            spaylater: '#3B9EFF',
            sp1:       '#A78BFA',
            sp2:       '#34D399',
            kosan:     '#FBBF24',
            darurat:   '#F472B6',
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-gray-50 dark:bg-[#0C0C12] text-gray-800 dark:text-gray-100 transition-colors duration-300">

  <canvas id="confetti-canvas"></canvas>

  <!-- Toast -->
  <div id="toast"
    class="fixed bottom-safe left-1/2 -translate-x-1/2 z-50 opacity-0 pointer-events-none
           bg-gray-900 dark:bg-white text-white dark:text-gray-900
           text-xs font-sora font-semibold px-4 py-2.5 rounded-full shadow-xl tracking-wide
           flex items-center gap-2 whitespace-nowrap">
    <i id="toast-icon" data-lucide="check-circle" class="w-3.5 h-3.5 shrink-0"></i>
    <span id="toast-text"></span>
  </div>

  <div class="max-w-lg mx-auto px-4 pt-8 pb-24">

    <!-- Header -->
    <div class="flex items-start justify-between mb-6">
      <div>
        <p class="text-[10px] tracking-[3px] text-gray-400 dark:text-gray-600 uppercase mb-1">Peta Tagihan</p>
        <h1 class="font-sora font-extrabold text-2xl text-gray-900 dark:text-white leading-tight">
          Cicilan <span class="text-brand">Bulanan</span>
        </h1>
        <p class="text-[11px] text-gray-400 dark:text-gray-600 mt-1 tracking-widest">Juni 2026 – selesai</p>
      </div>
      <!-- Dark/Light Toggle -->
      <div class="flex items-center gap-2 mt-1">
        <i data-lucide="sun" class="w-4 h-4 text-yellow-400"></i>
        <button id="themeToggle" onclick="toggleTheme()"
          class="relative w-12 h-6 rounded-full bg-gray-200 dark:bg-gray-700 focus:outline-none transition-colors duration-300"
          aria-label="Toggle tema">
          <span id="thumb"
            class="toggle-thumb absolute top-[3px] left-[3px] w-[18px] h-[18px] rounded-full bg-white dark:bg-brand shadow-sm dark:translate-x-6">
          </span>
        </button>
        <i data-lucide="moon" class="w-4 h-4 text-indigo-400"></i>
      </div>
    </div>

    <!-- Gamification Card -->
    <div class="bg-white dark:bg-[#13131C] border border-gray-200 dark:border-[#1E1E2A] rounded-2xl p-4 mb-5">
      <div class="flex items-center justify-between mb-3">
        <div>
          <p class="text-[9px] tracking-[2px] text-gray-400 uppercase mb-0.5">Progress Lunas</p>
          <p class="font-sora font-bold text-base text-gray-900 dark:text-white" id="gam-title">Mulai perjalananmu</p>
        </div>
        <div class="text-right">
          <p class="text-[9px] tracking-[2px] text-gray-400 uppercase mb-0.5">Streak</p>
          <p class="font-sora font-bold text-2xl text-brand flex items-center gap-1 justify-end" id="streak-val">
            <span id="streak-num">0</span>
            <i data-lucide="flame" class="w-5 h-5 text-orange-400 flame-icon"></i>
          </p>
        </div>
      </div>
      <!-- XP bar -->
      <div class="flex items-center gap-3 mb-2">
        <div class="flex items-center gap-1 w-14 shrink-0">
          <i data-lucide="zap" class="w-3 h-3 text-brand"></i>
          <span class="text-[10px] text-gray-400">XP</span>
        </div>
        <div class="flex-1 h-2 bg-gray-100 dark:bg-[#0f0f13] rounded-full overflow-hidden">
          <div id="xp-bar" class="prog-fill h-full bg-brand rounded-full" style="width:0%"></div>
        </div>
        <span class="text-[10px] text-brand font-bold w-16 text-right" id="xp-label">0 / 100</span>
      </div>
      <!-- Month bar -->
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1 w-14 shrink-0">
          <i data-lucide="calendar-check" class="w-3 h-3 text-sp2"></i>
          <span class="text-[10px] text-gray-400">Bln</span>
        </div>
        <div class="flex-1 h-2 bg-gray-100 dark:bg-[#0f0f13] rounded-full overflow-hidden">
          <div id="month-bar" class="prog-fill h-full bg-sp2 rounded-full" style="width:0%"></div>
        </div>
        <span class="text-[10px] text-sp2 font-bold w-16 text-right" id="month-label">0 / 21</span>
      </div>
      <!-- Badges -->
      <div id="badges" class="flex gap-2 mt-3 flex-wrap items-center"></div>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-2 gap-3 mb-5" id="summary"></div>

    <!-- Legend -->
    <div class="flex flex-wrap gap-x-4 gap-y-2 mb-4">
      <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-sm bg-kredivo   inline-block"></span><span class="text-[10px] text-gray-500 dark:text-gray-400">Kredivo</span></div>
      <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-sm bg-spaylater inline-block"></span><span class="text-[10px] text-gray-500 dark:text-gray-400">SPaylater</span></div>
      <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-sm bg-sp1       inline-block"></span><span class="text-[10px] text-gray-500 dark:text-gray-400">SPayPinjam 1</span></div>
      <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-sm bg-sp2       inline-block"></span><span class="text-[10px] text-gray-500 dark:text-gray-400">SPayPinjam 2</span></div>
      <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-sm bg-kosan     inline-block"></span><span class="text-[10px] text-gray-500 dark:text-gray-400">Kosan</span></div>
      <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-sm bg-darurat   inline-block"></span><span class="text-[10px] text-gray-500 dark:text-gray-400">Dana Darurat</span></div>
    </div>

    <!-- Month List -->
    <div id="list" class="space-y-2"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
